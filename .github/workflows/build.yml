name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Show artifact size
        run: |
          Get-Item target\release\curosu.exe | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}}

      - name: Package zip (exe + installer scripts)
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\curosu.exe dist\
          Copy-Item scripts\install.bat dist\
          Copy-Item scripts\install-uiaccess.ps1 dist\
          Copy-Item scripts\stop-running.ps1 dist\
          Compress-Archive -Path dist\* -DestinationPath curosu-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: curosu-win-x64
          path: curosu-win-x64.zip

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: curosu-win-x64.zip