[package]
name = "curosu"
version = "0.1.0"
edition = "2021"
description = "osu! Cursor overlay for Windows (Rust rewrite)"
license = "MIT"

[[bin]]
name = "curosu"
path = "src/main.rs"

[build-dependencies]
embed-resource = "2"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
egui = "0.28"
eframe = "0.28"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true